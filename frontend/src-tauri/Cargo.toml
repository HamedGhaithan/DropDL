[package]
name = "dropdl"
version = "0.8.4"
description = "A desktop GUI for yt-dlp"
authors = ["DropDL"]
edition = "2021"

[lib]
name = "dropdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
