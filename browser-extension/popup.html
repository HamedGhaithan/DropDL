<!doctype html><html><head><meta charset="utf-8"><style>body{width:290px;font:14px system-ui;background:#0c0c12;color:#f1eff6;padding:18px}h1{display:flex;align-items:center;gap:10px;font-size:19px;margin:0 0 8px;letter-spacing:-.01em}h1 img{width:30px;height:30px}p{color:#a39fb3;line-height:1.5}input,button{box-sizing:border-box;width:100%;padding:11px;border-radius:11px;margin:5px 0;font:inherit}input{background:#16151f;color:white;border:1px solid #2c2a3a}input:focus{outline:none;border-color:#8466ff;box-shadow:0 0 0 3px rgb(132 102 255/.3)}button{background:linear-gradient(135deg,#ff8a4c,#ff3d77 46%,#7a4dff);color:white;border:0;cursor:pointer;font-weight:700}button:focus-visible{outline:2px solid #fff;outline-offset:2px}#disconnect{background:#1c1b26;border:1px solid #2c2a3a;font-weight:600}#status{white-space:pre-wrap}a{color:#b9a8ff}</style></head><body><h1><img src="icons/icon-48.png" alt="">Send to DropDL</h1><p>Keep the desktop app running. Get a pairing code from its Library section.</p><div id="pairing"><input id="code" placeholder="Six-digit pairing code" maxlength="6" aria-label="Pairing code"><button id="pair">Pair with desktop</button></div><button id="send" hidden>Send current tab</button><button id="disconnect" hidden>Disconnect</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>
