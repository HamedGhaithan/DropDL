name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface (a release test checks its version)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Interface build and checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Interface regression suite
        run: npm run test:ui
      - name: Model checks
        run: |
          npm run test:timeline
          npm run test:fps
          npm run test:pro
          npm run test:studio
          node ../tests/clip-time.cjs

  macos:
    name: macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: apple-silicon
          - os: macos-15-intel
            arch: intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install FFmpeg (the full build: captions need libass)
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Build the interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt pyobjc
      - name: Run the backend tests on macOS
        run: python -m pytest tests -q
      - name: Build DropDLStudio.app
        env:
          DROPDL_BUILD_PYTHON: python
        run: bash scripts/build-native-macos.sh
      - name: Check, launch and package the app
        run: bash scripts/package-macos.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: DropDL-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
