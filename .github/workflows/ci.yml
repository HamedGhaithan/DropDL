name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the interface (a release test checks its version)
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  web:
    name: Web version tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            web/requirements.txt
            requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r web/requirements.txt -r requirements-dev.txt
      - run: python -m pytest web/tests -q

  web-image:
    name: Web image builds and runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f web/Dockerfile -t dropdl-web .
      - name: Start the container
        run: |
          docker run -d --name web -p 7860:7860 dropdl-web
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:7860/api/health >/dev/null && break; sleep 2; done
      - name: Smoke test (health, page, refused links)
        run: python3 web/smoke.py http://127.0.0.1:7860
      - name: Tools inside the image
        run: |
          docker exec web ffmpeg -version | head -1
          docker exec web python -m yt_dlp --version
          docker exec web node --version
      - name: Real trimmed download (needs archive.org; informational)
        continue-on-error: true
        run: python3 web/smoke.py http://127.0.0.1:7860 --download
      - name: Container log
        if: always()
        run: docker logs web

  frontend:
    name: Interface build and checks
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Interface regression suite
        run: npm run test:ui
      - name: Model checks
        run: |
          npm run test:timeline
          npm run test:fps
          npm run test:pro
          node ../tests/clip-time.cjs
